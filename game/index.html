<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Harbor — Open World Crime Game</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0e1a; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; image-rendering: auto; cursor: crosshair; }
  #fallback { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #ffd166; font: 16px/1.5 system-ui, sans-serif; text-align: center; display: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="fallback">Sunset Harbor needs JavaScript and a desktop browser to play.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
